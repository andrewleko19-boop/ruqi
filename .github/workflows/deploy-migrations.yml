name: Deploy DB Migrations

# Applies Supabase SQL migrations to the project whenever any file under
# supabase/migrations/ changes on main. Without this, migrations only exist in
# git — the running Postgres never gets them, so new tables/columns/functions
# referenced by the frontend return 404/42703/42883 in the browser.
#
# ⚠️ لا نستعمل `supabase link`. أمر link يجلب مفاتيح الـAPI للمشروع ليخزّنها،
#    ومنذ أن فعّل المشروع نظام المفاتيح الجديد (sb_publishable_/sb_secret_) صار
#    ردّ الـAPI يحوي مفتاحاً بحقل inserted_at بصيغةٍ ترفضها الأداة، فيفشل link
#    بـ«SchemaError ... inserted_at» — عطلٌ في الأداة لا في المشروع. الحلّ:
#    الاتصال المباشر بـ`db push --db-url` فلا يُجلَب أيّ مفتاح أصلاً.
#
#    ورابطُ الاتصال يُشتَقّ ذاتياً من الأسرار الموجودة (لا يحتاج سرّاً جديداً):
#    منطقة المشروع من Management API، ثمّ خادم الـpooler، ثمّ كلمة المرور. ويبقى
#    SUPABASE_DB_URL بديلاً يدوياً إن رغب أحدٌ بتزويده صراحةً.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migrations
  cancel-in-progress: false

jobs:
  deploy-migrations:
    name: Push migrations to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          DB_URL_MANUAL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail

          if [ -n "${DB_URL_MANUAL}" ]; then
            echo "استعمال SUPABASE_DB_URL المزوّد يدوياً."
            DB_URL="${DB_URL_MANUAL}"
          else
            echo "اشتقاق رابط الاتصال من الأسرار الموجودة…"

            if [ -z "${PROJECT_REF}" ] || [ -z "${DB_PASSWORD}" ] || [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
              echo "::error::نقص في الأسرار: يلزم SUPABASE_PROJECT_REF و SUPABASE_DB_PASSWORD و SUPABASE_ACCESS_TOKEN."
              exit 1
            fi

            # منطقة المشروع من Management API (jq مثبّت مسبقاً على ubuntu-latest).
            REGION=$(curl -sS \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              "https://api.supabase.com/v1/projects/${PROJECT_REF}" \
              | jq -r '.region // empty')
            if [ -z "${REGION}" ]; then
              echo "::error::تعذّر الحصول على منطقة المشروع من Management API. أضِف السرّ SUPABASE_DB_URL يدوياً (Supabase → Connect → Session pooler)."
              exit 1
            fi
            echo "منطقة المشروع: ${REGION}"

            # خادم الـpooler: البادئة قد تكون aws-0 أو aws-1 حسب عمر المشروع،
            # فنجرّب كليهما ونأخذ ما يُحلّ اسمه فعلاً — بلا تخمين.
            POOLER_HOST=""
            for prefix in aws-0 aws-1; do
              h="${prefix}-${REGION}.pooler.supabase.com"
              if getent hosts "${h}" >/dev/null 2>&1; then POOLER_HOST="${h}"; break; fi
            done
            if [ -z "${POOLER_HOST}" ]; then
              echo "::error::تعذّر تحليل اسم خادم الـpooler للمنطقة ${REGION}. أضِف السرّ SUPABASE_DB_URL يدوياً."
              exit 1
            fi
            echo "خادم الـpooler: ${POOLER_HOST}"

            # ترميز كلمة المرور لتأمين أيّ محرفٍ خاصّ داخل الرابط.
            ENC_PW=$(python3 -c 'import urllib.parse,os;print(urllib.parse.quote(os.environ["DB_PASSWORD"],safe=""))')
            # session pooler على المنفذ 5432 (يدعم DDL الكامل الذي تحتاجه الهجرات).
            DB_URL="postgresql://postgres.${PROJECT_REF}:${ENC_PW}@${POOLER_HOST}:5432/postgres"
          fi

          # --include-all: يطبّق كلّ هجرةٍ غير مطبَّقة حتى لو كان ترتيبها أقدم من
          # آخر ما في جدول السجلّ — لازمٌ للتطبيق الأول. الرابط لا يُطبَع أبداً.
          supabase db push --db-url "${DB_URL}" --include-all
