name: Deploy DB Migrations

# Applies Supabase SQL migrations to the project whenever any file under
# supabase/migrations/ changes on main. Without this, migrations only exist in
# git — the running Postgres never gets them, so new tables/columns/functions
# referenced by the frontend return 404/42703/42883 in the browser.
#
# ⚠️ لا نستعمل `supabase link`. أمر link يجلب مفاتيح الـAPI للمشروع ليخزّنها،
#    ومنذ أن فعّل المشروع نظام المفاتيح الجديد (sb_publishable_/sb_secret_) صار
#    ردّ الـAPI يحوي مفتاحاً بحقل inserted_at بصيغةٍ ترفضها الأداة، فيفشل link
#    بـ«SchemaError ... inserted_at» — عطلٌ في الأداة لا في المشروع. الحلّ:
#    الاتصال المباشر بـ`db push --db-url` فلا يُجلَب أيّ مفتاح أصلاً.
#
#    ورابطُ الاتصال يُشتَقّ ذاتياً من الأسرار الموجودة (لا يحتاج سرّاً جديداً):
#    منطقة المشروع من Management API، ثمّ خادم الـpooler، ثمّ كلمة المرور. ويبقى
#    SUPABASE_DB_URL بديلاً يدوياً إن رغب أحدٌ بتزويده صراحةً.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migrations
  cancel-in-progress: false

jobs:
  deploy-migrations:
    name: Push migrations to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # ⚠️ الإصدار مثبَّتٌ عمداً ولا يُترك على `latest`. مع `latest` يجلب كلُّ تشغيلٍ
      #    أحدثَ إصدارٍ صدر لتوّه، فإصدارٌ كاسرٌ واحد من Supabase يوقف النشر فجأةً
      #    دون أن يتغيّر شيءٌ في هذا المستودع — وتشخيصُ عطلٍ كهذا مكلفٌ لأنّ الكود
      #    نفسه سليم. الترقية تصير قراراً واعياً: بدّل الرقم وراقب التشغيل.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          DB_URL_MANUAL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail

          # --include-all: يطبّق كلّ هجرةٍ غير مطبَّقة حتى لو كان ترتيبها أقدم من
          # آخر ما في جدول السجلّ — لازمٌ للتطبيق الأول. الرابط لا يُطبَع أبداً.
          push() { supabase db push --db-url "$1" --include-all; }

          # مسارٌ يدويّ صريح إن زُوّد.
          if [ -n "${DB_URL_MANUAL}" ]; then
            echo "استعمال SUPABASE_DB_URL المزوّد يدوياً."
            push "${DB_URL_MANUAL}"
            exit $?
          fi

          echo "اشتقاق رابط الاتصال من الأسرار الموجودة…"
          if [ -z "${PROJECT_REF}" ] || [ -z "${DB_PASSWORD}" ] || [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::نقص في الأسرار: يلزم SUPABASE_PROJECT_REF و SUPABASE_DB_PASSWORD و SUPABASE_ACCESS_TOKEN."
            exit 1
          fi

          # منطقة المشروع من Management API (jq مثبّت مسبقاً على ubuntu-latest).
          REGION=$(curl -sS \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}" \
            | jq -r '.region // empty')
          if [ -z "${REGION}" ]; then
            echo "::error::تعذّر الحصول على منطقة المشروع من Management API. أضِف السرّ SUPABASE_DB_URL يدوياً (Supabase → Connect → Session pooler)."
            exit 1
          fi
          echo "منطقة المشروع: ${REGION}"

          # ترميز كلمة المرور لتأمين أيّ محرفٍ خاصّ داخل الرابط.
          ENC_PW=$(python3 -c 'import urllib.parse,os;print(urllib.parse.quote(os.environ["DB_PASSWORD"],safe=""))')

          # ⚠️ عنقود الـpooler: البادئة aws-0/aws-1 (وأحياناً aws-2) — وكلاهما
          # يُحلّ اسمه في DNS، لكنّ مستأجر المشروع مسجّلٌ على واحدٍ منها فقط. لا
          # يكفي فحص DNS إذن؛ نجرّب الاتصال الفعلي بكلٍّ ونتوقّف على الذي يجد
          # المستأجر. «tenant/user … not found» أو تعذّرُ الاتصال = العنقود
          # الخطأ فنُكمل؛ وأيّ خطأٍ آخر بعد نجاح الاتصال خطأُ هجرةٍ حقيقيّ فنتوقّف.
          applied=0
          for prefix in aws-0 aws-1 aws-2; do
            HOST="${prefix}-${REGION}.pooler.supabase.com"
            echo "محاولة عبر ${HOST} …"
            URL="postgresql://postgres.${PROJECT_REF}:${ENC_PW}@${HOST}:5432/postgres"
            if OUT=$(push "${URL}" 2>&1); then
              echo "${OUT}"
              applied=1
              break
            fi
            echo "${OUT}"
            if echo "${OUT}" | grep -qiE "tenant/user .* not found|failed to connect|ENOTFOUND|no such host|could not translate host"; then
              echo "→ العنقود ${prefix} ليس مستأجَر المشروع، أُكمل للتالي."
              continue
            fi
            echo "::error::فشل db push بخطأٍ ليس اتصالاً (خطأ هجرةٍ محتمل). راجع المخرجات أعلاه."
            exit 1
          done

          if [ "${applied}" != "1" ]; then
            echo "::error::تعذّر إيجاد مستأجر المشروع على أيّ عنقود pooler للمنطقة ${REGION}. أضِف السرّ SUPABASE_DB_URL يدوياً من Supabase → Connect → Session pooler."
            exit 1
          fi
          echo "✅ طُبّقت الهجرات بنجاح."
