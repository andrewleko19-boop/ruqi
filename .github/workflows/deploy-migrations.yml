name: Deploy DB Migrations

# Applies Supabase SQL migrations to the project whenever any file under
# supabase/migrations/ changes on main. Without this, migrations only exist in
# git — the running Postgres never gets them, so new tables/columns/functions
# referenced by the frontend return 404/42703/42883 in the browser.
#
# ⚠️ لا نستعمل `supabase link`. أمر link يجلب مفاتيح الـAPI للمشروع ليخزّنها،
#    ومنذ أن فعّل المشروع نظام المفاتيح الجديد (sb_publishable_/sb_secret_) صار
#    ردّ الـAPI يحوي مفتاحاً بحقل inserted_at بصيغةٍ ترفضها الأداة، فيفشل link
#    بـ«SchemaError ... inserted_at» — عطلٌ في الأداة لا في المشروع. الحلّ:
#    الاتصال المباشر بـ`db push --db-url` فلا يُجلَب أيّ مفتاح أصلاً.
#
#    ورابطُ الاتصال يُشتَقّ ذاتياً من الأسرار الموجودة (لا يحتاج سرّاً جديداً):
#    منطقة المشروع من Management API، ثمّ خادم الـpooler، ثمّ كلمة المرور. ويبقى
#    SUPABASE_DB_URL بديلاً يدوياً إن رغب أحدٌ بتزويده صراحةً.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migrations
  cancel-in-progress: false

jobs:
  deploy-migrations:
    name: Push migrations to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ⚠️ العمقُ الكامل لازم: مصالحةُ نسخةٍ يتيمة تشترط شهادةَ تاريخ git على
      #    أنّ ملفَّها حُذف عمداً. والاستنساخُ السطحيّ (عمق ١، وهو الافتراض)
      #    لا تاريخَ فيه — فتُقرأ كلُّ حالةٍ «لا أثرَ للحذف» ويُرفض ما يجب قبولُه.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ⚠️ الإصدار مثبَّتٌ عمداً ولا يُترك على `latest`. مع `latest` يجلب كلُّ تشغيلٍ
      #    أحدثَ إصدارٍ صدر لتوّه، فإصدارٌ كاسرٌ واحد من Supabase يوقف النشر فجأةً
      #    دون أن يتغيّر شيءٌ في هذا المستودع — وتشخيصُ عطلٍ كهذا مكلفٌ لأنّ الكود
      #    نفسه سليم. الترقية تصير قراراً واعياً: بدّل الرقم وراقب التشغيل.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          DB_URL_MANUAL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail

          # --include-all: يطبّق كلّ هجرةٍ غير مطبَّقة حتى لو كان ترتيبها أقدم من
          # آخر ما في جدول السجلّ — لازمٌ للتطبيق الأول. الرابط لا يُطبَع أبداً.
          push() { supabase db push --db-url "$1" --include-all; }

          # ── مصالحةُ نسخةٍ نُشرت ثمّ حُذف ملفُّها (revert أو إعادة ترقيم) ────
          # جدولُ سجلّ الهجرات يحتفظ بالرقم، فيرفض db push المتابعةَ برسالة
          # «Remote migration versions not found in local migrations directory».
          # نُصالح — لكن **بضيقٍ محسوب**: لا يُقبل إلّا رقمٌ يشهد تاريخُ git أنّ
          # ملفَّه حُذف عمداً. فحذفٌ مقصود يُصالَح آلياً، أمّا نسخةُ عملٍ ناقصة
          # أو checkout فاسد فيبقى الفشلُ عالياً كما يجب.
          # ⚠️ لا `… | grep -q` تحت pipefail: grep يخرج عند أوّل تطابقٍ فيغلق
          # الأنبوب، فيتلقّى المُنتِجُ SIGPIPE (141) وتُقرأ الحالةُ فشلاً —
          # فينقلب «وجدتُه» إلى «لم أجده» صامتاً. تُلتقط المخرجاتُ مرّةً ثمّ
          # تُفحَص في الذاكرة.
          DELETED_MIGS=$(git log --all --pretty=format: --name-only --diff-filter=D \
                          -- supabase/migrations || true)

          repair_orphans() {
            local url="$1" out="$2" ver ok=0
            for ver in $(echo "${out}" | grep -oE 'migration repair --status reverted [0-9]{14}' \
                                        | grep -oE '[0-9]{14}' | sort -u); do
              if compgen -G "supabase/migrations/${ver}_*.sql" > /dev/null; then
                echo "::error::${ver} موجودٌ محلّياً — الرفضُ ليس يُتماً، لا تُصالِح."
                return 1
              fi
              case "${DELETED_MIGS}" in
                *"/${ver}_"*) ;;
                *) echo "::error::${ver} في القاعدة ولا أثرَ لحذفه في تاريخ git — نسخةُ عملٍ ناقصة؟"
                   return 1 ;;
              esac
              echo "مصالحة: ${ver} حُذف ملفُّه عمداً، يُعلَّم مُراجَعاً."
              supabase migration repair --status reverted "${ver}" --db-url "${url}" || return 1
              ok=1
            done
            [ "${ok}" = "1" ]
          }

          # مسارٌ يدويّ صريح إن زُوّد.
          if [ -n "${DB_URL_MANUAL}" ]; then
            echo "استعمال SUPABASE_DB_URL المزوّد يدوياً."
            push "${DB_URL_MANUAL}"
            exit $?
          fi

          echo "اشتقاق رابط الاتصال من الأسرار الموجودة…"
          if [ -z "${PROJECT_REF}" ] || [ -z "${DB_PASSWORD}" ] || [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::نقص في الأسرار: يلزم SUPABASE_PROJECT_REF و SUPABASE_DB_PASSWORD و SUPABASE_ACCESS_TOKEN."
            exit 1
          fi

          # منطقة المشروع من Management API (jq مثبّت مسبقاً على ubuntu-latest).
          REGION=$(curl -sS \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}" \
            | jq -r '.region // empty')
          if [ -z "${REGION}" ]; then
            echo "::error::تعذّر الحصول على منطقة المشروع من Management API. أضِف السرّ SUPABASE_DB_URL يدوياً (Supabase → Connect → Session pooler)."
            exit 1
          fi
          echo "منطقة المشروع: ${REGION}"

          # ترميز كلمة المرور لتأمين أيّ محرفٍ خاصّ داخل الرابط.
          ENC_PW=$(python3 -c 'import urllib.parse,os;print(urllib.parse.quote(os.environ["DB_PASSWORD"],safe=""))')

          # ⚠️ عنقود الـpooler: البادئة aws-0/aws-1 (وأحياناً aws-2) — وكلاهما
          # يُحلّ اسمه في DNS، لكنّ مستأجر المشروع مسجّلٌ على واحدٍ منها فقط. لا
          # يكفي فحص DNS إذن؛ نجرّب الاتصال الفعلي بكلٍّ ونتوقّف على الذي يجد
          # المستأجر. «tenant/user … not found» أو تعذّرُ الاتصال = العنقود
          # الخطأ فنُكمل؛ وأيّ خطأٍ آخر بعد نجاح الاتصال خطأُ هجرةٍ حقيقيّ فنتوقّف.
          applied=0
          WORKING_URL=""
          for prefix in aws-0 aws-1 aws-2; do
            HOST="${prefix}-${REGION}.pooler.supabase.com"
            echo "محاولة عبر ${HOST} …"
            URL="postgresql://postgres.${PROJECT_REF}:${ENC_PW}@${HOST}:5432/postgres"
            if OUT=$(push "${URL}" 2>&1); then
              echo "${OUT}"
              applied=1
              WORKING_URL="${URL}"
              break
            fi
            echo "${OUT}"
            if echo "${OUT}" | grep -qiE "tenant/user .* not found|failed to connect|ENOTFOUND|no such host|could not translate host"; then
              echo "→ العنقود ${prefix} ليس مستأجَر المشروع، أُكمل للتالي."
              continue
            fi
            # وصلنا القاعدةَ فعلاً: يُتمُ نسخةٍ حُذف ملفُّها يُصالَح ثمّ يُعاد الدفع مرّةً.
            if echo "${OUT}" | grep -q "Remote migration versions not found in local migrations directory"; then
              if repair_orphans "${URL}" "${OUT}"; then
                echo "أُعيد الدفعُ بعد المصالحة…"
                if OUT2=$(push "${URL}" 2>&1); then
                  echo "${OUT2}"
                  applied=1
                  WORKING_URL="${URL}"
                  break
                fi
                echo "${OUT2}"
              fi
            fi
            echo "::error::فشل db push بخطأٍ ليس اتصالاً (خطأ هجرةٍ محتمل). راجع المخرجات أعلاه."
            exit 1
          done

          if [ "${applied}" != "1" ]; then
            echo "::error::تعذّر إيجاد مستأجر المشروع على أيّ عنقود pooler للمنطقة ${REGION}. أضِف السرّ SUPABASE_DB_URL يدوياً من Supabase → Connect → Session pooler."
            exit 1
          fi

          # ── تحقّقٌ إلزاميّ: «نجح db push» ليس «وصلت كلّ الهجرات» ────────────
          # القاعدةُ تسجّل رقمَ النسخة لا اسمَ الملفّ، والسجلُّ لا يُمحى بـrevert.
          # فملفٌّ جديدٌ يحمل رقماً سبق أن نُشر يُعَدّ مطبَّقاً سلفاً **فيُتخطّى
          # صامتاً**: لا تحذير، ولا رمز خروجٍ غير صفر، و«✅» تُطبع كالعادة.
          #
          # وقع فعلاً: هجرةٌ تستعيد أعمدةً محذوفة من دالّتَي الإحصاء لم تصل
          # القاعدةَ قطّ، فبقيت لوحتا المديرية والوزارة تعرضان أصفاراً أسبوعاً
          # كاملاً بينما الشيفرة في المستودع صحيحة والنشرُ «ناجح».
          #
          # migration list هو الحَكَم: يقابل المحلّي بالبعيد صفّاً صفّاً.
          echo "التحقّق من وصول كلّ هجرةٍ فعلاً…"
          LIST=$(supabase migration list --db-url "${WORKING_URL}" 2>&1) || {
            echo "${LIST}"
            echo "::error::تعذّر قراءة سجلّ الهجرات للتحقّق."
            exit 1
          }
          echo "${LIST}"
          export MIG_LIST="${LIST}"
          python3 <<'PY' || exit 1
          import os, re, sys, pathlib
          listing = os.environ["MIG_LIST"]
          local = sorted(p.name for p in pathlib.Path("supabase/migrations").glob("*.sql"))
          missing = []
          for name in local:
              m = re.match(r"(\d{14})_", name)
              if not m:
                  continue
              ver = m.group(1)
              # صفُّ الجدول: LOCAL │ REMOTE │ TIME. المطبَّقُ يذكر الرقمَ مرّتين.
              row = next((l for l in listing.splitlines() if ver in l), None)
              if row is None or row.count(ver) < 2:
                  missing.append(name)
          if missing:
              print("::error::هجراتٌ لم تصل القاعدة رغم «نجاح» db push:")
              for n in missing:
                  print(f"  · {n}")
              print("السببُ الأشيع: رقمُ نسخةٍ سبق أن نُشر ثمّ أُعيد استعمالُه لملفٍّ آخر.")
              print("الحلّ: أعطِ الملفَّ رقماً أعلى من أعلى نسخةٍ مطبَّقة، وادفع ثانيةً.")
              sys.exit(1)
          print(f"✔ كلُّ الهجرات المحلّية ({len(local)}) مسجَّلةٌ في القاعدة.")
          PY
          echo "✅ طُبّقت الهجرات بنجاح."
