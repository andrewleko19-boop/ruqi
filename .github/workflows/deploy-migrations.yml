name: Deploy DB Migrations

# Applies Supabase SQL migrations to the project whenever any file under
# supabase/migrations/ changes on main. Without this, migrations only exist in
# git — the running Postgres never gets them, so new tables/columns/functions
# referenced by the frontend return 404/42703/42883 in the browser.
#
# ⚠️ لا نستعمل `supabase link`. أمر link يجلب مفاتيح الـAPI للمشروع ليخزّنها،
#    ومنذ أن فعّل المشروع نظام المفاتيح الجديد (sb_publishable_/sb_secret_) صار
#    ردّ الـAPI يحوي مفتاحاً بحقل inserted_at بصيغةٍ ترفضها الأداة، فيفشل link
#    بـ«SchemaError ... inserted_at» — وهو عطلٌ في الأداة لا في المشروع، ولا
#    تُصلحه نسخةٌ أقدم لأنّ المفاتيح هي ما تغيّر. الحلّ: تخطّي link نهائياً
#    والاتصال المباشر بـ`db push --db-url`، فلا يُجلَب أيّ مفتاح أصلاً.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migrations
  cancel-in-progress: false

jobs:
  deploy-migrations:
    name: Push migrations to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify DB URL secret is present
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "::error::السرّ SUPABASE_DB_URL غير موجود. أضِفه من Supabase → Connect → Session pooler (سلسلة الاتصال كاملةً مع كلمة المرور)."
            exit 1
          fi

      - name: Push migrations
        # --db-url يتّصل مباشرةً بقاعدة البيانات عبر session pooler (IPv4، يدعم
        # الـDDL الكامل الذي تحتاجه الهجرات). لا link، لا جلب مفاتيح، لا عطل.
        # --include-all: يطبّق كلّ هجرةٍ غير مطبَّقة حتى لو كان ترتيبها أقدم من
        # آخر ما في جدول السجلّ — لازمٌ للتطبيق الأول.
        run: supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}" --include-all
