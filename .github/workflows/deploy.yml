name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Re-validate before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: node tools/check-js-syntax.mjs
      - run: npm run check:html
      - run: node tools/check-versions.mjs
      - run: node tools/check-manifest.mjs

  # Build and deploy are intentionally separate jobs (GitHub's canonical Pages
  # pattern). Keeping the artifact upload out of the deploy job means that
  # clicking "Re-run failed jobs" after a deploy failure re-runs ONLY deploy —
  # it does not re-upload, so the run never ends up with two artifacts named
  # "github-pages" (the cause of the past "Multiple artifacts" deploy failure).
  build:
    name: Build Pages artifact
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        # Ships the whole multi-page site (root landing + role folders + shared/).
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
