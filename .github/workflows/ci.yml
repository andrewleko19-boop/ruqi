name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate HTML / JS / versions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        # العمقُ الكامل: حارسُ تصادم أرقام الهجرات في check-sql-drift يقرأ
        # تاريخ git كلَّه — الملفُّ المحذوف هو بيتُ الداء، والسطحيُّ لا يراه.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dev tooling
        run: npm ci --no-audit --no-fund

      - name: JS syntax check (all pages + modules)
        run: node tools/check-js-syntax.mjs

      # يُمسك «مرجعٌ بلا تعريف» — عائلةُ العلل التي تمرّ من node --check ومن
      # اختبارات الوحدة ومن الفحص الدخانيّ، ثمّ تسقط عند أوّل استعمالٍ حقيقيّ.
      - name: Undeclared-reference check
        run: npm run check:undef

      - name: HTML validation (all pages)
        run: npm run check:html

      - name: Content-Security-Policy tags match generator
        run: npm run check:csp

      - name: Cache-version check
        run: node tools/check-versions.mjs

      - name: Manifest sanity
        run: node tools/check-manifest.mjs

      - name: db.js import/export consistency
        run: node tools/check-db-imports.mjs

      # دالّةٌ في docs/database-setup.sql وحدها لا تصل الإنتاج — والزرّ الذي
      # يستدعيها يسقط بـ 42883 بعد أشهر. حدث فعلاً مع upsert_year_results.
      - name: SQL reference/migrations drift
        run: npm run check:sql

      # استيرادٌ ساكن لا يُخزَّن مسبقاً يمنع تنفيذ ملفّ البوّابة كلِّه أوفلاين،
      # فلا تظهر اللوحة. حدث مع shared/permissions.js في ستّ بوّابات معاً.
      - name: Service-worker precache coverage
        run: npm run check:precache

      - name: Unit tests
        run: npm test

  rls-isolation:
    name: RLS tenant-isolation test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # الإصدار مثبَّتٌ ومطابقٌ لبقية السيور — انظر tools/check-versions.mjs.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start local Supabase
        run: supabase start -x realtime,imgproxy,edge-runtime,logflare,vector,pgbouncer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install RLS audit dependencies
        run: npm install --no-audit --no-fund
        working-directory: tools/rls-audit

      - name: Run RLS SQL isolation test
        run: node rls-sql-test.mjs
        working-directory: tools/rls-audit
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # الدوال SECURITY DEFINER تتجاوز RLS بالتصميم، فالخطوة أعلاه لا تغطّيها.
      - name: Run RPC scope isolation test
        run: node rpc-scope-test.mjs
        working-directory: tools/rls-audit
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  smoke:
    name: Smoke-test every portal in a real browser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tooling
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      # يفتح كلّ بوّابة ويشترط ألّا تُخطئ. يُكمّل فحص no-undef: ذاك يمسك
      # المراجع المفقودة، وهذا يمسك ما لا يظهر إلا عند التحميل الفعليّ.
      - name: Smoke
        run: node tools/smoke-portals.mjs

  edge-functions:
    name: Type-check Supabase Edge Functions (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # الاستيراد يأتي من esm.sh — وهي CDN طرفٍ ثالث تسقط أحياناً (رأينا 522
      # من Cloudflare يُفشل بناءً سليماً تماماً). التخبئة تجعل البناءات التالية
      # لا تلمس الشبكة أصلاً ما دامت الاستيرادات لم تتغيّر.
      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/*/index.ts') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Type-check every edge function
        # deno check resolves the https:// imports (supabase-js) and validates the
        # Deno globals, catching type errors before `supabase functions deploy`.
        #
        # يُعاد المحاولة ثلاثاً: مع مخبأٍ باردٍ وCDN متعثّرة يفشل الجلب لا الكود،
        # وإفشالُ البناء لسببٍ شبكيّ عابر يُخفي نتيجةَ الفحص الحقيقية.
        run: |
          for attempt in 1 2 3; do
            if deno check supabase/functions/*/index.ts; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::deno check failed (attempt $attempt/3) — retrying after backoff"
              sleep $((attempt * 10))
            fi
          done
          echo "::error::deno check failed after 3 attempts"
          exit 1
