name: Dump baseline schema

# تصدير بنية القاعدة الحيّة (جداول + قيود + دوال + سياسات RLS) بلا أي بيانات.
#
# لماذا هذا السير موجود أصلاً:
#   supabase/migrations/ يحوي هجراتٍ ترقيعيةً فقط — لا واحدة منها تُنشئ الجداول
#   الأساسية (schools/students/classes/users…). البنية أُنشئت يدوياً في لوحة
#   Supabase ولم تُلتقَط قطّ. النتيجة أنّ المستودع **لا يستطيع** إعادة بناء
#   القاعدة من الصفر: لا نشرٌ على خادمٍ جديد (خوادم الوزارة المحلية)، ولا تعافٍ
#   من كارثة، ولا قاعدةٌ مؤقّتة في CI لاختبار عزل RLS.
#
# لماذا هنا لا على جهاز المطوّر:
#   `supabase db dump` يشغّل pg_dump داخل حاوية، فيلزمه Docker — وهو عبءٌ ثقيل
#   للتثبيت على ويندوز لأجل تصديرٍ واحد. منفّذ GitHub فيه Docker جاهز، وكلمة سرّ
#   القاعدة موجودة أصلاً في أسرار المستودع فلا تخرج إلى أي مكان جديد.
#
# الاستعمال: Actions → Dump baseline schema → Run workflow، ثم نزّل النتيجة من
# قسم Artifacts وضعها في المستودع. النتيجة **لا تُدفَع تلقائياً**: تُراجَع بعين
# إنسان أولاً، ويؤكّد السير نفسه أنها خالية من البيانات قبل رفعها.
on:
  workflow_dispatch:
    inputs:
      schemas:
        description: 'Comma-separated schemas to dump (leave empty for the CLI default: public)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  dump:
    name: Dump schema from the live project
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # الإصدار مثبَّتٌ ومطابقٌ لبقية سيور النشر — انظر tools/check-versions.mjs.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dump schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD:   ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF:   ${{ secrets.SUPABASE_PROJECT_REF }}
          DB_URL_MANUAL: ${{ secrets.SUPABASE_DB_URL }}
          SCHEMAS:       ${{ inputs.schemas }}
        run: |
          set -uo pipefail

          OUT=baseline-schema.sql
          ARGS=(--file "$OUT")
          if [ -n "${SCHEMAS}" ]; then ARGS+=(--schema "${SCHEMAS}"); fi

          # بلا --data-only وبلا --role-only ⇒ بنيةٌ فقط. الرابط لا يُطبَع أبداً.
          dump() { supabase db dump --db-url "$1" "${ARGS[@]}"; }

          if [ -n "${DB_URL_MANUAL}" ]; then
            echo "استعمال SUPABASE_DB_URL المزوّد يدوياً."
            dump "${DB_URL_MANUAL}" || { echo "::error::فشل التصدير عبر SUPABASE_DB_URL."; exit 1; }
          else
            echo "اشتقاق رابط الاتصال من الأسرار الموجودة…"
            if [ -z "${PROJECT_REF}" ] || [ -z "${DB_PASSWORD}" ] || [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
              echo "::error::نقص في الأسرار: يلزم SUPABASE_PROJECT_REF و SUPABASE_DB_PASSWORD و SUPABASE_ACCESS_TOKEN."
              exit 1
            fi

            REGION=$(curl -sS \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              "https://api.supabase.com/v1/projects/${PROJECT_REF}" \
              | jq -r '.region // empty')
            if [ -z "${REGION}" ]; then
              echo "::error::تعذّر الحصول على منطقة المشروع. أضِف السرّ SUPABASE_DB_URL يدوياً (Supabase → Connect → Session pooler)."
              exit 1
            fi
            echo "منطقة المشروع: ${REGION}"

            ENC_PW=$(python3 -c 'import urllib.parse,os;print(urllib.parse.quote(os.environ["DB_PASSWORD"],safe=""))')

            # مستأجر المشروع مسجَّلٌ على عنقودٍ واحد فقط من aws-0/1/2 وكلّها تُحلّ
            # في DNS — نفس منطق deploy-migrations.yml: نجرّب الاتصال الفعلي بكلٍّ.
            ok=0
            for prefix in aws-0 aws-1 aws-2; do
              HOST="${prefix}-${REGION}.pooler.supabase.com"
              echo "محاولة عبر ${HOST} …"
              if ERR=$(dump "postgresql://postgres.${PROJECT_REF}:${ENC_PW}@${HOST}:5432/postgres" 2>&1); then
                ok=1; break
              fi
              echo "${ERR}"
              if echo "${ERR}" | grep -qiE "tenant/user .* not found|failed to connect|ENOTFOUND|no such host|could not translate host"; then
                echo "→ العنقود ${prefix} ليس مستأجَر المشروع، أُكمل للتالي."
                continue
              fi
              echo "::error::فشل التصدير بخطأٍ ليس اتصالاً. راجع المخرجات أعلاه."
              exit 1
            done
            [ "${ok}" = "1" ] || { echo "::error::تعذّر إيجاد مستأجر المشروع على أي عنقود pooler للمنطقة ${REGION}."; exit 1; }
          fi

          [ -s "$OUT" ] || { echo "::error::الملفّ الناتج فارغ."; exit 1; }

          # حارس الخصوصية: التصدير يجب أن يكون بنيةً بحتة. أي سطر بيانات يعني
          # أنّ سجلات طلاب حقيقية على وشك أن تُرفَع كأثرٍ (artifact) — نتوقّف.
          DATA_LINES=$(grep -cE '^(INSERT INTO|COPY )' "$OUT" || true)
          if [ "${DATA_LINES}" != "0" ]; then
            echo "::error::الملفّ يحوي ${DATA_LINES} سطر بيانات — يجب أن يكون بنيةً فقط. أُلغي الرفع."
            exit 1
          fi

          TABLES=$(grep -cE '^CREATE TABLE' "$OUT" || true)
          POLICIES=$(grep -cE '^CREATE POLICY' "$OUT" || true)
          FUNCS=$(grep -cE '^CREATE (OR REPLACE )?FUNCTION' "$OUT" || true)

          {
            echo "### baseline-schema.sql"
            echo ""
            echo "| ماذا | كم |"
            echo "|---|---|"
            echo "| الحجم | $(wc -c < "$OUT") بايت |"
            echo "| الأسطر | $(wc -l < "$OUT") |"
            echo "| CREATE TABLE | ${TABLES} |"
            echo "| CREATE POLICY | ${POLICIES} |"
            echo "| CREATE FUNCTION | ${FUNCS} |"
            echo "| أسطر بيانات | ${DATA_LINES} (يجب أن تكون صفراً) |"
            echo ""
            echo "نزّل الملفّ من قسم **Artifacts** في أعلى هذه الصفحة."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "✅ التصدير تمّ: ${TABLES} جدولاً، ${POLICIES} سياسة، ${FUNCS} دالّة، بلا أي بيانات."

      - name: Upload the dump
        uses: actions/upload-artifact@v4
        with:
          name: baseline-schema
          path: baseline-schema.sql
          retention-days: 7
          if-no-files-found: error
