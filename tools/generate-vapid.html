<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>توليد مفاتيح VAPID</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 16px; background: #f8fafc; }
  h2   { color: #1a2744; text-align: center; }
  .box { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; margin: 16px 0; }
  label { font-size: .85rem; color: #64748b; display: block; margin-bottom: 4px; }
  textarea {
    width: 100%; box-sizing: border-box;
    font-family: monospace; font-size: .78rem;
    border: 1px solid #cbd5e1; border-radius: 6px;
    padding: 8px; resize: none; background: #f1f5f9;
    word-break: break-all;
  }
  button {
    width: 100%; padding: 10px; margin-top: 8px;
    background: #1a2744; color: #fff; border: none;
    border-radius: 8px; font-size: .9rem; cursor: pointer;
  }
  button:active { opacity: .8; }
  .note { font-size: .8rem; color: #ef4444; margin-top: 12px; text-align: center; }
  .ok  { color: #16a34a; }
</style>
</head>
<body>
<h2>🔑 توليد مفاتيح VAPID</h2>
<p style="text-align:center;font-size:.85rem;color:#64748b">
  المفاتيح تتولد داخل متصفحك فقط — لا تُرسل لأي خادم
</p>

<div class="box">
  <label>المفتاح العام — VAPID_PUBLIC_KEY</label>
  <textarea id="pub" rows="3" readonly></textarea>
  <button onclick="copy('pub', this)">نسخ المفتاح العام</button>
</div>

<div class="box">
  <label>المفتاح الخاص — VAPID_PRIVATE_KEY</label>
  <textarea id="priv" rows="3" readonly></textarea>
  <button onclick="copy('priv', this)">نسخ المفتاح الخاص</button>
</div>

<div class="note" id="status">جاري التوليد…</div>

<script>
async function generate() {
  const b64u = (buf) =>
    btoa(String.fromCharCode(...new Uint8Array(buf)))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');

  const kp = await crypto.subtle.generateKey(
    { name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']
  );
  const pub  = await crypto.subtle.exportKey('raw',   kp.publicKey);
  const priv = await crypto.subtle.exportKey('pkcs8', kp.privateKey);

  document.getElementById('pub').value  = b64u(pub);
  document.getElementById('priv').value = b64u(priv);
  document.getElementById('status').textContent =
    '✓ تم التوليد — انسخ كل مفتاح واحفظه في مكان آمن';
  document.getElementById('status').className = 'note ok';
}

async function copy(id, btn) {
  const val = document.getElementById(id).value;
  try {
    await navigator.clipboard.writeText(val);
    btn.textContent = '✓ تم النسخ!';
  } catch {
    document.getElementById(id).select();
    document.execCommand('copy');
    btn.textContent = '✓ تم النسخ!';
  }
  setTimeout(() => btn.textContent = id === 'pub' ? 'نسخ المفتاح العام' : 'نسخ المفتاح الخاص', 2000);
}

generate();
</script>
</body>
</html>
